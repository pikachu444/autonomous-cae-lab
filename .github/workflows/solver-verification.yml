name: Solver numerical verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Run all solver checks or one existing solver CI job
        type: choice
        options: [full, job]
        default: full
      job_selection:
        description: 'Job mode: run one existing solver CI job with its original runtime and checks'
        type: choice
        options: [native, native-registration, structural, optimization, pde, codeaster, explicit, doe]
        default: native
      codeaster_check:
        description: 'Job mode, codeaster only: choose an existing check'
        type: choice
        options: [all, elasticity, structural-families, plasticity, material-point, model-optimization, material-inverse]
        default: all

permissions:
  contents: read

concurrency:
  group: caelab-solver-${{ github.ref }}${{ inputs.mode == 'job' && format('-job-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  invalid-selection:
    name: Solver invalid selection
    if: ${{ github.event_name == 'workflow_dispatch' && (!contains(fromJSON('["full","job"]'), inputs.mode) || (inputs.mode == 'job' && !contains(fromJSON('["native","native-registration","structural","optimization","pde","codeaster","explicit","doe"]'), inputs.job_selection))) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unsupported manual mode or job
        shell: python
        run: raise SystemExit('Choose a supported workflow mode and job_selection.')

  native:
    name: Solver native integration
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'native') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install pinned FreeCAD command wrapper
        id: freecad_runtime
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage \
            --output /tmp/fixture-freecad.AppImage
          echo 'f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434  /tmp/fixture-freecad.AppImage' | sha256sum --check
          chmod +x /tmp/fixture-freecad.AppImage
          install -m 755 plugins/fixture_design/upstream/scripts/freecad_appimage.sh /tmp/fixture-freecad-cmd.sh
          echo "FREECAD_APPIMAGE=/tmp/fixture-freecad.AppImage" >> "$GITHUB_ENV"
          echo "FREECAD_CMD=/tmp/fixture-freecad-cmd.sh" >> "$GITHUB_ENV"
      - name: Core to native Part and Sketcher acceptance
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.freecad_runtime.outcome == 'success' }}
        run: python -m scripts.verify_native --store artifacts/native-lab
      - name: Imported native Part and reordered named Sketcher acceptance
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.freecad_runtime.outcome == 'success' }}
        run: python -m scripts.verify_native_edits --store artifacts/native-edits-lab
      - name: Native face mechanics dependencies
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.freecad_runtime.outcome == 'success' }}
        id: mechanics_runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx libglu1-mesa
          python -m pip install -r requirements-native-mechanics.txt
      - name: Native faces and partial DOFs compared with the full affine reference
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.freecad_runtime.outcome == 'success' && steps.mechanics_runtime.outcome == 'success' }}
        run: python -m scripts.accept_native_structural --store artifacts/native-mechanics-lab
      - name: Preserve CAD revisions and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solver-native-cae-lab-${{ github.sha }}
          path: |
            artifacts/native-lab/
            artifacts/native-edits-lab/
            artifacts/native-mechanics-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  native-registration:
    name: Solver native registration
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'native-registration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install pinned FreeCAD command wrapper
        id: freecad_runtime
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage \
            --output /tmp/fixture-freecad.AppImage
          echo 'f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434  /tmp/fixture-freecad.AppImage' | sha256sum --check
          chmod +x /tmp/fixture-freecad.AppImage
          install -m 755 plugins/fixture_design/upstream/scripts/freecad_appimage.sh /tmp/fixture-freecad-cmd.sh
          echo "FREECAD_APPIMAGE=/tmp/fixture-freecad.AppImage" >> "$GITHUB_ENV"
          echo "FREECAD_CMD=/tmp/fixture-freecad-cmd.sh" >> "$GITHUB_ENV"
      - name: Recover native registration after writes and process interruption
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.freecad_runtime.outcome == 'success' }}
        run: python -m scripts.verify_native_registration --store artifacts/native-registration-lab
      - name: Preserve failed preparations, original revisions and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solver-native-registration-cae-lab-${{ github.sha }}
          path: artifacts/native-registration-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  structural:
    name: Solver structural verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'structural') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install pinned distribution solver packages
        id: solver_runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh calculix-ccx
          gmsh -version
          ccx -v || true
      - name: Analyze the registered CAD experiment's exact STEP
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.solver_runtime.outcome == 'success' }}
        run: python -m scripts.verify_analysis --store artifacts/linear-lab
      - name: Check 1.5 mm displacement trend and analytical loaded-patch area
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.solver_runtime.outcome == 'success' }}
        run: python -m scripts.verify_finer_mesh --store artifacts/finer-lab
      - name: Preserve mesh, deck, raw fields and digital thread
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solver-structural-cae-lab-${{ github.sha }}
          path: |
            artifacts/linear-lab/
            artifacts/finer-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  optimization:
    name: Solver optimization verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'optimization') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install structural solvers for adaptive numerical evaluations
        id: solver_runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh calculix-ccx
          gmsh -version
          ccx -v || true
      - name: Optimize through immutable CAD and structural evaluations with interruption/replay
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.solver_runtime.outcome == 'success' }}
        run: python -m scripts.verify_optimization --store artifacts/optimization-lab
      - name: Preserve plans, evaluations, checkpoints and solver evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solver-optimization-cae-lab-${{ github.sha }}
          path: artifacts/optimization-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  pde:
    name: Solver PDE verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'pde') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CAELAB_FENICSX_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install pinned real-valued FEniCSx in the separate system Python
        id: pde_runtime
        run: |
          sudo add-apt-repository --yes ppa:fenics-packages/fenics
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config \
            python3-dolfinx=1:0.11.0.post0-2~ppa1~noble1 \
            python3-dolfinx-real=1:0.11.0.post0-2~ppa1~noble1 \
            python3-gmsh=4.12.1+ds1-1.1build2
      - name: Compare declared weak forms with analytical solutions and convergence rates
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        id: linear_acceptance
        run: python -m scripts.verify_pde --store artifacts/pde-lab
      - name: Verify full Newton histories, nonlinear manufactured fields and the exact linear limit
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_nonlinear_pde --store artifacts/nonlinear-pde-lab
      - name: Verify declared rectangles, mixed named fluxes, changed domains and numerical refusals
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_rectangle_pde --store artifacts/rectangle-pde-lab
      - name: Verify complete initial and transient histories with separate time and mesh refinement
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_transient_pde --store artifacts/transient-pde-lab
      - name: Verify coupled vector directions, blocked DOFs and independent full-field error integration
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        id: vector_acceptance
        shell: bash
        run: python -m scripts.verify_vector_pde --store artifacts/vector-pde-lab 2>&1 | tee "$RUNNER_TEMP/vector-pde-check.log"
      - name: Annotate vector acceptance failure
        if: ${{ failure() && steps.vector_acceptance.outcome == 'failure' }}
        run: python scripts/ci_annotate_failure.py "$RUNNER_TEMP/vector-pde-check.log"
      - name: Verify two coupled scalar fields across a conforming material interface
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_coupled_pde --store artifacts/coupled-pde-lab
      - name: Verify immutable imported meshes and named physical PDE boundaries
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_imported_pde --store artifacts/imported-pde-lab
      - name: Connect actual PDE to the common local research/results surface
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' && steps.linear_acceptance.outcome == 'success' }}
        run: python -m scripts.verify_lab_ui --store artifacts/http-pde-lab --library pde=artifacts/pde-lab
      - name: Preserve weak forms, field data, raw errors and common evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solver-pde-cae-lab-${{ github.sha }}
          path: |
            artifacts/pde-lab/
            artifacts/nonlinear-pde-lab/
            artifacts/rectangle-pde-lab/
            artifacts/transient-pde-lab/
            artifacts/vector-pde-lab/
            artifacts/coupled-pde-lab/
            artifacts/imported-pde-lab/
            artifacts/http-pde-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  codeaster:
    name: Solver Code_Aster verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'codeaster') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - name: Validate Code_Aster check selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'job' }}
        env:
          CODEASTER_CHECK: ${{ inputs.codeaster_check }}
        shell: python
        run: |
          import os
          selection = os.environ['CODEASTER_CHECK']
          allowed = {'all', 'elasticity', 'structural-families', 'plasticity',
                     'material-point', 'model-optimization', 'material-inverse'}
          if selection not in allowed:
              raise SystemExit('Choose a Code_Aster check: ' + ', '.join(sorted(allowed)))
          print('Selected Code_Aster check:', selection)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install the external pinned solver runtime without replacing Lab Python
        id: codeaster_runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y singularity-container=4.1.1+ds2-1ubuntu0.3 gmsh calculix-ccx
          singularity version
          singularity pull --disable-cache /tmp/caelab-codeaster.sif \
            docker://simvia/code_aster@sha256:d8d19ea91989eac0d38195bc5795c54c69f530f7196f53d67697ffa57c9106d5
          echo "CAELAB_CODEASTER_IMAGE=/tmp/caelab-codeaster.sif" >> "$GITHUB_ENV"
          echo "CAELAB_CODEASTER_IMAGE_SHA256=$(sha256sum /tmp/caelab-codeaster.sif | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Compare independent declared elasticity with analytical fields and signed reactions
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'job' || inputs.codeaster_check == 'all' || inputs.codeaster_check == 'elasticity') }}
        run: python -m scripts.verify_codeaster --store artifacts/codeaster-lab
      - name: Compare complete beam, pressure cylinder and curved roof fields across two native solvers
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'job' || inputs.codeaster_check == 'all' || inputs.codeaster_check == 'structural-families') }}
        id: family_acceptance
        shell: bash
        run: python -m scripts.verify_structural_families --store artifacts/structural-family-lab --source-commit "${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/structural-family-check.log"
      - name: Annotate structural family acceptance failure
        if: ${{ failure() && steps.family_acceptance.outcome == 'failure' }}
        run: python scripts/ci_annotate_failure.py "$RUNNER_TEMP/structural-family-check.log"
      - name: Verify complete native J2 load and unload histories on two meshes
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'job' || inputs.codeaster_check == 'all' || inputs.codeaster_check == 'plasticity') }}
        run: python -m scripts.verify_plasticity --store artifacts/plasticity-lab
      - name: Verify real MGIS and MTest stress histories and consistent tangents
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'job' || inputs.codeaster_check == 'all' || inputs.codeaster_check == 'material-point') }}
        run: python -m scripts.verify_material_point --store artifacts/material-point-lab
      - name: Search declared modulus using measured native fields with interruption and replay
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'job' || inputs.codeaster_check == 'all' || inputs.codeaster_check == 'model-optimization') }}
        run: python -m scripts.verify_model_optimization --store artifacts/model-optimization-lab
      - name: Verify synthetic material inverse after sealed OCI runtime admission
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'job' || inputs.codeaster_check == 'all' || inputs.codeaster_check == 'material-inverse') }}
        env:
          CAELAB_MFRONT_INVERSE_RUNTIME_PROFILE: SEALED_OCI
        run: python -m scripts.verify_material_inverse --store artifacts/material-inverse-lab
      - name: Preserve native inputs, guarded mesh, MED fields and analytical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solver-codeaster-cae-lab-${{ github.sha }}
          path: |
            artifacts/codeaster-lab/
            artifacts/structural-family-lab/
            artifacts/plasticity-lab/
            artifacts/material-point-lab/
            artifacts/model-optimization-lab/
            artifacts/material-inverse-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  explicit:
    name: Solver explicit verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'explicit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install the digest-pinned OpenCourant successor runtime outside the repository
        id: radioss_runtime
        run: |
          lab_radioss_dir="$RUNNER_TEMP/caelab-opencourant-latest-20261006"
          mkdir -p "$lab_radioss_dir"
          # The original OpenRadioss 20260728 release endpoint was removed.
          # This is a newly qualified successor build; historical pins stay in evidence.
          curl --fail --location --retry 3 \
            https://github.com/OpenCourant/OpenCourant/releases/download/latest-20261006/OpenCourant_linux64.zip \
            -o "$lab_radioss_dir/OpenCourant_linux64.zip"
          echo "9d67531de156dd9beba05fbfe710dcdc2bcecbdf3dc3a12642cf85dcece80081  $lab_radioss_dir/OpenCourant_linux64.zip" | sha256sum --check --strict
          unzip -q "$lab_radioss_dir/OpenCourant_linux64.zip" -d "$lab_radioss_dir"
          chmod +x "$lab_radioss_dir"/OpenCourant/exec/*
          echo "CAELAB_OPENRADIOSS_ROOT=$lab_radioss_dir/OpenCourant" >> "$GITHUB_ENV"
      - name: Verify flight prerequisites and preserve full-history wall rejection
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.radioss_runtime.outcome == 'success' }}
        run: |
          python -m scripts.verify_openradioss --store artifacts/explicit-lab || test "$?" -eq 2
          python - <<'PY'
          from pathlib import Path
          from caelab import Lab
          from caelab.storage import load_json
          root = Path('artifacts/explicit-lab')
          report = load_json(root / 'acceptance.json')
          assert report['freefall_sensitivity'] == report['invalid_input_admission'] == 'PASS'
          assert report['decision'] == 'NOT_RELEASED'
          assert report['status'] in {'PASS', 'PARTIAL'}
          lab = Lab(root)
          for identifier in report['experiments']:
              result = lab.inspect_experiment(identifier)
              assert result['decision'] == 'NOT_RELEASED'
              if identifier.startswith('E-freefall'):
                  assert result['status'] == 'COMPLETED_REVIEW_REQUIRED'
              if identifier.startswith('E-ground-stop'):
                  assert result['solver_status'] == 'COMPLETED'
                  assert result['status'] in {'COMPLETED_REVIEW_REQUIRED', 'REJECTED'}
          if report['status'] == 'PARTIAL':
              assert report['ideal_ground_stop'] == 'REJECTED'
              assert any(lab.inspect_experiment(identifier)['status'] == 'REJECTED'
                         for identifier in ('E-ground-stop', 'E-ground-stop-finer'))
          PY
      - name: Verify actual finite-force compliant-stop histories, energy and rebound
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.radioss_runtime.outcome == 'success' }}
        run: python -m scripts.verify_compliant_drop --store artifacts/compliant-drop-lab
      - name: Preserve native flight, contact failures and all common evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solver-explicit-cae-lab-${{ github.sha }}
          path: |
            artifacts/explicit-lab/
            artifacts/compliant-drop-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  doe:
    name: Solver DOE verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'doe') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install structural solver for sampled CAD children
        id: solver_runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh calculix-ccx
          gmsh -version
          ccx -v || true
      - name: Run seeded DOE through CAD gates and structural child runs
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.solver_runtime.outcome == 'success' }}
        run: python -m scripts.verify_doe --store artifacts/doe-lab
      - name: Preserve campaign plans, journals, CAD and solver evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solver-doe-cae-lab-${{ github.sha }}
          path: artifacts/doe-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
