name: NS1 focused checks

on:
  push:
    branches: [codex/nonlinear-user-model-20261014]
    paths:
      - 'caelab/**'
      - 'apps/desktop_pre/**'
      - 'tests/test_ns1*'
      - '.github/workflows/ns1-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retain the exact source for disconnected review
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=zip --output=artifacts/ns1-source.zip HEAD
      - run: python -m pip install numpy pytest
      - name: Check material execution boundaries only
        run: python -m pytest tests/test_calculix_material.py tests/test_ns1_material_limits.py -q --junitxml=artifacts/material-tests.xml
      - name: Publish source and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns1-focused-source
          path: artifacts/
          retention-days: 1
          if-no-files-found: error
