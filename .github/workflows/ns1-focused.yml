name: NS1 focused checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      NS1_RENDER_DIR: artifacts/qt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pytest jsonschema filelock matplotlib PySide6-Essentials==6.9.1 shiboken6==6.9.1
      - name: Require actual Fortran parser check
        run: command -v gfortran
      - name: Focused non-native integration and real Qt checks
        run: |
          mkdir -p artifacts
          python -m pytest tests/test_calculix_material.py tests/test_ns1_*.py tests/test_contact.py tests/test_contact_execution.py tests/test_contact_native_export.py tests/test_contact_steps.py tests/test_contact_steps_ui.py tests/test_contact_tie.py tests/test_frozen_fem.py tests/test_pre_fem_edit.py tests/test_pre_fem_panel_ui.py tests/test_contact_inspection.py -q --junitxml=artifacts/focused-tests.xml
      - name: Retain exact source; no native solver-completion claim
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=zip --output=artifacts/ns1-source.zip HEAD
      - name: Publish source, report and Qt captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ns1-focused-source
          path: artifacts/
          retention-days: 1
          if-no-files-found: error
