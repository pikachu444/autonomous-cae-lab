name: Post native Windows SDK

on:
  workflow_dispatch:
    inputs:
      recover_runtime:
        description: 'Keep the verified runtime in an unpublished draft release (no Actions artifact/cache storage)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: post-native-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-plugin:
    # Standard public Windows runners have free compute. Never run this in a
    # private repository or select a larger/self-hosted runner.
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    timeout-minutes: 360
    # Manual runs on trusted main only. Write access is used solely to recover
    # a successful runtime in a draft release when explicitly selected.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm public repository and standard Windows environment
        run: |
          $repo = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          if ($repo.private -ne $false -or $env:RUNNER_OS -ne 'Windows') {
            throw 'This workflow requires a public repository and standard Windows runner.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or
              $env:GITHUB_RUN_ID -notmatch '^\d+$' -or $env:GITHUB_RUN_ATTEMPT -notmatch '^\d+$') {
            throw 'Runner temporary path and run identity are required before preparing SDK inputs.'
          }
          $postRoot = Join-Path $env:RUNNER_TEMP ("cae-post-native-{0}-{1}" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "POST_NATIVE_ROOT=$postRoot" -Encoding utf8
          $repo | Select-Object full_name,private,html_url | ConvertTo-Json
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,TotalVisibleMemorySize,FreePhysicalMemory
          foreach ($path in @('C:\', $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($path))
            [pscustomobject]@{path=$path; volume=$drive.Name; available_bytes=$drive.AvailableFreeSpace;
              total_bytes=$drive.TotalSize} | ConvertTo-Json -Compress
          }
          git rev-parse HEAD
      # Pin an official CPython 3.12 Windows binary release.
      # 3.12.14 has no Windows x64 package in actions/python-versions.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: Fetch verified public SDK inputs and license notices
        run: |
          ./scripts/fetch_post_native_windows.ps1 -WorkRoot $env:POST_NATIVE_ROOT
      - name: Build SDK and plugin, run existing native checks in one owned Job
        run: |
          $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $pwsh = (Get-Command pwsh -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          python scripts/native_check.py --timeout 19500 --output-dir "$env:POST_NATIVE_ROOT/build-job" -- $pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/scripts/build_post_native_windows.ps1" -WorkRoot $env:POST_NATIVE_ROOT -Python $python
          if ($LASTEXITCODE -ne 0) { throw "Owned SDK build/check failed: $LASTEXITCODE" }
          $receipt = Get-Content -LiteralPath "$env:POST_NATIVE_ROOT/build-job/native-check.json" -Raw | ConvertFrom-Json
          if ($receipt.cleanup -ne 'job_empty' -or $receipt.cleanup_error -or $receipt.timed_out) {
            throw 'SDK build/check Job cleanup or timeout requires review.'
          }
      - name: Package the verified runtime in one owned Job
        if: ${{ inputs.recover_runtime }}
        run: |
          $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $pwsh = (Get-Command pwsh -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          python scripts/native_check.py --timeout 1800 --output-dir "$env:POST_NATIVE_ROOT/recovery-job" -- $pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/scripts/package_post_runtime_windows.ps1" -WorkRoot $env:POST_NATIVE_ROOT -Python $python
          if ($LASTEXITCODE -ne 0) { throw "Owned runtime packaging failed: $LASTEXITCODE" }
          $receipt = Get-Content -LiteralPath "$env:POST_NATIVE_ROOT/recovery-job/native-check.json" -Raw | ConvertFrom-Json
          if ($receipt.cleanup -ne 'job_empty' -or $receipt.cleanup_error -or $receipt.timed_out) {
            throw 'Runtime packaging Job cleanup or timeout requires review.'
          }
      - name: Recover runtime volumes in an unpublished draft release
        if: ${{ inputs.recover_runtime }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $recovery = Join-Path $env:POST_NATIVE_ROOT 'recovery'
          $receiptPath = Join-Path $recovery 'package-receipt.json'
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.schema -ne 'cae.post-runtime-recovery/1' -or
              $receipt.source_commit -ne $env:GITHUB_SHA -or
              $receipt.staged_artifact_verification -ne 'PASSED' -or
              $receipt.archive_test -ne 'PASSED' -or $receipt.publication -ne 'NONE') {
            throw 'Only the verified runtime from this exact source may be recovered.'
          }
          $volumes = @(Get-ChildItem -LiteralPath $recovery -File -Filter 'post-runtime.7z.*' | Sort-Object Name)
          if ($volumes.Count -eq 0 -or $volumes.Count -ne @($receipt.volumes).Count) {
            throw 'Runtime volume inventory differs from its packaging receipt.'
          }
          foreach ($volume in $volumes) {
            $entry = @($receipt.volumes | Where-Object { $_.file -eq $volume.Name })
            if ($entry.Count -ne 1 -or $volume.Length -ge 1900MB -or
                $entry[0].bytes -ne $volume.Length -or
                $entry[0].sha256 -ne (Get-FileHash -LiteralPath $volume.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) {
              throw 'A runtime volume is absent, changed or exceeds the recovery size limit.'
            }
          }
          $tag = "post-runtime-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $notes = Join-Path $recovery 'draft-notes.md'
          @(
            'Development runtime recovery. This release remains an unpublished draft.'
            ''
            "Source: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA"
            "Workflow: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ''
            'Download every post-runtime.7z volume and package-receipt.json together.'
            'The archive includes its file inventory, licenses, source references and Korean recovery instructions.'
            'SDK plugin load and the existing comparison checks passed. Actual desktop exit and clean-PC installation are NOT_RUN.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title 'Post Windows development runtime' --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation was not confirmed; inspect this run tag before retrying.' }
          $uploadFiles = @($volumes.FullName) + @($receiptPath)
          gh release upload $tag @uploadFiles --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload was not confirmed; keep and inspect the existing draft.' }
          $url = gh release view $tag --repo $env:GITHUB_REPOSITORY --json url --jq .url
          if ($LASTEXITCODE -ne 0) { throw 'Uploaded draft readback failed.' }
          "### Runtime recovery`n`nUnpublished draft: $url`n`nNo Actions artifact or cache storage was used. Actual desktop exit acceptance remains NOT_RUN." >> $env:GITHUB_STEP_SUMMARY
      - name: Print receipts without Actions artifact/cache storage
        if: always()
        run: |
          $root = $env:POST_NATIVE_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) {
            Write-Output 'Receipt output skipped: SDK root initialization did not complete; see the original failed step.'
            exit 0
          }
          @('inputs.json','build-evidence.json','build-job/native-check.json',
            'plugin-build/core-test-job/native-check.json',
            'checks/load/native-check.json','checks/create/native-check.json','checks/cold/native-check.json') | ForEach-Object {
            $file = Join-Path $root $_
            if (Test-Path -LiteralPath $file) {
              Write-Output "--- $_"
              Get-Content -LiteralPath $file -Raw
            }
          }
          @('build-job/stdout.log','build-job/stderr.log') | ForEach-Object {
            $file = Join-Path $root $_
            if (Test-Path -LiteralPath $file) { Get-Content -LiteralPath $file -Tail 120 }
          }
          @('checks/load-dependencies.log','checks/load-dependency-closure.log',
            'plugin-build/core-test-job/stdout.log',
            'checks/load/stdout.log','checks/load/stderr.log',
            'checks/create/stdout.log','checks/create/stderr.log',
            'checks/cold/stdout.log','checks/cold/stderr.log') | ForEach-Object {
            $file = Join-Path $root $_
            if (Test-Path -LiteralPath $file) {
              Write-Output "--- $_"
              if ($_ -in @('checks/load-dependencies.log','checks/load-dependency-closure.log')) { Get-Content -LiteralPath $file }
              else { Get-Content -LiteralPath $file -Tail 120 }
            }
          }
          "### Post Windows SDK check`n`nCommit: $env:GITHUB_SHA`n`nNo Actions cache/artifact storage or public release is created. Optional runtime recovery uses an unpublished draft only. Actual desktop input acceptance is NOT_RUN." >> $env:GITHUB_STEP_SUMMARY
