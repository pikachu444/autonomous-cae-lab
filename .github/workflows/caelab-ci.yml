  pde:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'pde') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CAELAB_FENICSX_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install pinned real-valued FEniCSx in the separate system Python
        id: pde_runtime
        run: |
          sudo add-apt-repository --yes ppa:fenics-packages/fenics
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config \
            python3-dolfinx=1:0.11.0.post0-2~ppa1~noble1 \
            python3-dolfinx-real=1:0.11.0.post0-2~ppa1~noble1 \
            python3-gmsh=4.12.1+ds1-1.1build2
      - name: Compare declared weak forms with analytical solutions and convergence rates
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        id: linear_acceptance
        run: python -m scripts.verify_pde --store artifacts/pde-lab
      - name: Verify full Newton histories, nonlinear manufactured fields and the exact linear limit
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_nonlinear_pde --store artifacts/nonlinear-pde-lab
      - name: Verify declared rectangles, mixed named fluxes, changed domains and numerical refusals
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_rectangle_pde --store artifacts/rectangle-pde-lab
      - name: Verify complete initial and transient histories with separate time and mesh refinement
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_transient_pde --store artifacts/transient-pde-lab
      - name: Verify coupled vector directions, blocked DOFs and independent full-field error integration
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        id: vector_acceptance
        shell: bash
        run: python -m scripts.verify_vector_pde --store artifacts/vector-pde-lab 2>&1 | tee "$RUNNER_TEMP/vector-pde-check.log"
      - name: Annotate vector acceptance failure
        if: ${{ failure() && steps.vector_acceptance.outcome == 'failure' }}
        run: python scripts/ci_annotate_failure.py "$RUNNER_TEMP/vector-pde-check.log"
      - name: Verify two coupled scalar fields across a conforming material interface
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_coupled_pde --store artifacts/coupled-pde-lab
      - name: Verify immutable imported meshes and named physical PDE boundaries
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' }}
        run: python -m scripts.verify_imported_pde --store artifacts/imported-pde-lab
      - name: Connect actual PDE to the common local research/results surface
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.pde_runtime.outcome == 'success' && steps.linear_acceptance.outcome == 'success' }}
        run: python -m scripts.verify_lab_ui --store artifacts/http-pde-lab --library pde=artifacts/pde-lab
      - name: Preserve weak forms, field data, raw errors and common evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pde-cae-lab-${{ github.sha }}
          path: |
            artifacts/pde-lab/
            artifacts/nonlinear-pde-lab/
            artifacts/rectangle-pde-lab/
            artifacts/transient-pde-lab/
            artifacts/vector-pde-lab/
            artifacts/coupled-pde-lab/
            artifacts/imported-pde-lab/
            artifacts/http-pde-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  codeaster:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'codeaster') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install the external pinned solver runtime without replacing Lab Python
        id: codeaster_runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y singularity-container=4.1.1+ds2-1ubuntu0.3 gmsh calculix-ccx
          singularity version
          singularity pull --disable-cache /tmp/caelab-codeaster.sif \
            docker://simvia/code_aster@sha256:d8d19ea91989eac0d38195bc5795c54c69f530f7196f53d67697ffa57c9106d5
          echo "CAELAB_CODEASTER_IMAGE=/tmp/caelab-codeaster.sif" >> "$GITHUB_ENV"
          echo "CAELAB_CODEASTER_IMAGE_SHA256=$(sha256sum /tmp/caelab-codeaster.sif | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Compare independent declared elasticity with analytical fields and signed reactions
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' }}
        run: python -m scripts.verify_codeaster --store artifacts/codeaster-lab
      - name: Compare complete beam, pressure cylinder and curved roof fields across two native solvers
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' }}
        id: family_acceptance
        shell: bash
        run: python -m scripts.verify_structural_families --store artifacts/structural-family-lab --source-commit "${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/structural-family-check.log"
      - name: Annotate structural family acceptance failure
        if: ${{ failure() && steps.family_acceptance.outcome == 'failure' }}
        run: python scripts/ci_annotate_failure.py "$RUNNER_TEMP/structural-family-check.log"
      - name: Verify complete native J2 load and unload histories on two meshes
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' }}
        run: python -m scripts.verify_plasticity --store artifacts/plasticity-lab
      - name: Verify real MGIS and MTest stress histories and consistent tangents
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' }}
        run: python -m scripts.verify_material_point --store artifacts/material-point-lab
      - name: Search declared modulus using measured native fields with interruption and replay
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' }}
        run: python -m scripts.verify_model_optimization --store artifacts/model-optimization-lab
      - name: Verify synthetic material inverse after sealed OCI runtime admission
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.codeaster_runtime.outcome == 'success' }}
        env:
          CAELAB_MFRONT_INVERSE_RUNTIME_PROFILE: SEALED_OCI
        run: python -m scripts.verify_material_inverse --store artifacts/material-inverse-lab
      - name: Preserve native inputs, guarded mesh, MED fields and analytical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeaster-cae-lab-${{ github.sha }}
          path: |
            artifacts/codeaster-lab/
            artifacts/structural-family-lab/
            artifacts/plasticity-lab/
            artifacts/material-point-lab/
            artifacts/model-optimization-lab/
            artifacts/material-inverse-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  explicit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'explicit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
        id: python_deps
      - name: Install the digest-pinned OpenCourant successor runtime outside the repository
        id: radioss_runtime
        run: |
          lab_radioss_dir="$RUNNER_TEMP/caelab-opencourant-latest-20261006"
          mkdir -p "$lab_radioss_dir"
          # The original OpenRadioss 20260728 release endpoint was removed.
          # This is a newly qualified successor build; historical pins stay in evidence.
          curl --fail --location --retry 3 \
            https://github.com/OpenCourant/OpenCourant/releases/download/latest-20261006/OpenCourant_linux64.zip \
            -o "$lab_radioss_dir/OpenCourant_linux64.zip"
          echo "9d67531de156dd9beba05fbfe710dcdc2bcecbdf3dc3a12642cf85dcece80081  $lab_radioss_dir/OpenCourant_linux64.zip" | sha256sum --check --strict
          unzip -q "$lab_radioss_dir/OpenCourant_linux64.zip" -d "$lab_radioss_dir"
          chmod +x "$lab_radioss_dir"/OpenCourant/exec/*
          echo "CAELAB_OPENRADIOSS_ROOT=$lab_radioss_dir/OpenCourant" >> "$GITHUB_ENV"
      - name: Verify flight prerequisites and preserve full-history wall rejection
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.radioss_runtime.outcome == 'success' }}
        run: |
          python -m scripts.verify_openradioss --store artifacts/explicit-lab || test "$?" -eq 2
          python - <<'PY'
          from pathlib import Path
          from caelab import Lab
          from caelab.storage import load_json
          root = Path('artifacts/explicit-lab')
          report = load_json(root / 'acceptance.json')
          assert report['freefall_sensitivity'] == report['invalid_input_admission'] == 'PASS'
          assert report['decision'] == 'NOT_RELEASED'
          assert report['status'] in {'PASS', 'PARTIAL'}
          lab = Lab(root)
          for identifier in report['experiments']:
              result = lab.inspect_experiment(identifier)
              assert result['decision'] == 'NOT_RELEASED'
              if identifier.startswith('E-freefall'):
                  assert result['status'] == 'COMPLETED_REVIEW_REQUIRED'
              if identifier.startswith('E-ground-stop'):
                  assert result['solver_status'] == 'COMPLETED'
                  assert result['status'] in {'COMPLETED_REVIEW_REQUIRED', 'REJECTED'}
          if report['status'] == 'PARTIAL':
              assert report['ideal_ground_stop'] == 'REJECTED'
              assert any(lab.inspect_experiment(identifier)['status'] == 'REJECTED'
                         for identifier in ('E-ground-stop', 'E-ground-stop-finer'))
          PY
      - name: Verify actual finite-force compliant-stop histories, energy and rebound
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.radioss_runtime.outcome == 'success' }}
        run: python -m scripts.verify_compliant_drop --store artifacts/compliant-drop-lab
      - name: Preserve native flight, contact failures and all common evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: explicit-cae-lab-${{ github.sha }}
          path: |
            artifacts/explicit-lab/
            artifacts/compliant-drop-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

