name: CAE Lab verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-mcp.txt
            plugins/fixture_design/upstream/requirements.txt
            plugins/fixture_design/upstream/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/verify_mcp.py
      - name: Verify native OpenScience source and tool guards without model calls
        run: |
          node --version
          node --test openscience/tests/native_guard.test.mjs
          node --test openscience/tests/native_git_state.test.mjs
      - name: Connect the local HTTP research, CAD gates and verified evidence exports
        run: python -m scripts.verify_lab_ui --store artifacts/http-core-lab --skip-pde
      - name: Preserve common HTTP acceptance and portable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: http-core-cae-lab-${{ github.sha }}
          path: artifacts/http-core-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  native:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned FreeCAD command wrapper
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage \
            --output /tmp/fixture-freecad.AppImage
          echo 'f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434  /tmp/fixture-freecad.AppImage' | sha256sum --check
          chmod +x /tmp/fixture-freecad.AppImage
          install -m 755 plugins/fixture_design/upstream/scripts/freecad_appimage.sh /tmp/fixture-freecad-cmd.sh
          echo "FREECAD_APPIMAGE=/tmp/fixture-freecad.AppImage" >> "$GITHUB_ENV"
          echo "FREECAD_CMD=/tmp/fixture-freecad-cmd.sh" >> "$GITHUB_ENV"
      - name: Core to native Part and Sketcher acceptance
        run: python -m scripts.verify_native --store artifacts/native-lab
      - name: Imported native Part and reordered named Sketcher acceptance
        run: python -m scripts.verify_native_edits --store artifacts/native-edits-lab
      - name: Preserve CAD revisions and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-cae-lab-${{ github.sha }}
          path: |
            artifacts/native-lab/
            artifacts/native-edits-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  structural:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned distribution solver packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh calculix-ccx
          gmsh -version
          ccx -v || true
      - name: Analyze the registered CAD experiment's exact STEP
        run: python -m scripts.verify_analysis --store artifacts/linear-lab
      - name: Check 1.5 mm displacement trend and analytical loaded-patch area
        run: python -m scripts.verify_finer_mesh --store artifacts/finer-lab
      - name: Preserve mesh, deck, raw fields and digital thread
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structural-cae-lab-${{ github.sha }}
          path: |
            artifacts/linear-lab/
            artifacts/finer-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  optimization:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install structural solvers for adaptive numerical evaluations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh calculix-ccx
          gmsh -version
          ccx -v || true
      - name: Optimize through immutable CAD and structural evaluations with interruption/replay
        run: python -m scripts.verify_optimization --store artifacts/optimization-lab
      - name: Preserve plans, evaluations, checkpoints and solver evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optimization-cae-lab-${{ github.sha }}
          path: artifacts/optimization-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  pde:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CAELAB_FENICSX_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned real-valued FEniCSx in the separate system Python
        run: |
          sudo add-apt-repository --yes ppa:fenics-packages/fenics
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config \
            python3-dolfinx=1:0.11.0.post0-2~ppa1~noble1 \
            python3-dolfinx-real=1:0.11.0.post0-2~ppa1~noble1
      - name: Compare declared weak forms with analytical solutions and convergence rates
        run: python -m scripts.verify_pde --store artifacts/pde-lab
      - name: Verify full Newton histories, nonlinear manufactured fields and the exact linear limit
        run: python -m scripts.verify_nonlinear_pde --store artifacts/nonlinear-pde-lab
      - name: Connect actual PDE to the common local research/results surface
        run: python -m scripts.verify_lab_ui --store artifacts/http-pde-lab --library pde=artifacts/pde-lab
      - name: Preserve weak forms, field data, raw errors and common evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pde-cae-lab-${{ github.sha }}
          path: |
            artifacts/pde-lab/
            artifacts/nonlinear-pde-lab/
            artifacts/http-pde-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  codeaster:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install the external pinned solver runtime without replacing Lab Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y singularity-container=4.1.1+ds2-1ubuntu0.3 gmsh
          singularity version
          singularity pull --disable-cache /tmp/caelab-codeaster.sif \
            docker://simvia/code_aster@sha256:d8d19ea91989eac0d38195bc5795c54c69f530f7196f53d67697ffa57c9106d5
          echo "CAELAB_CODEASTER_IMAGE=/tmp/caelab-codeaster.sif" >> "$GITHUB_ENV"
          echo "CAELAB_CODEASTER_IMAGE_SHA256=$(sha256sum /tmp/caelab-codeaster.sif | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Compare independent declared elasticity with analytical fields and signed reactions
        run: python -m scripts.verify_codeaster --store artifacts/codeaster-lab
      - name: Verify complete native J2 load and unload histories on two meshes
        run: python -m scripts.verify_plasticity --store artifacts/plasticity-lab
      - name: Verify real MGIS and MTest stress histories and consistent tangents
        run: python -m scripts.verify_material_point --store artifacts/material-point-lab
      - name: Search declared modulus using measured native fields with interruption and replay
        run: python -m scripts.verify_model_optimization --store artifacts/model-optimization-lab
      - name: Verify synthetic material inverse after sealed OCI runtime admission
        env:
          CAELAB_MFRONT_INVERSE_RUNTIME_PROFILE: SEALED_OCI
        run: python -m scripts.verify_material_inverse --store artifacts/material-inverse-lab
      - name: Preserve native inputs, guarded mesh, MED fields and analytical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeaster-cae-lab-${{ github.sha }}
          path: |
            artifacts/codeaster-lab/
            artifacts/plasticity-lab/
            artifacts/material-point-lab/
            artifacts/model-optimization-lab/
            artifacts/material-inverse-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  explicit:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install the digest-pinned official OpenRadioss runtime outside the repository
        run: |
          lab_radioss_dir="$RUNNER_TEMP/caelab-openradioss-latest-20260728"
          mkdir -p "$lab_radioss_dir"
          curl --fail --location --retry 3 \
            https://github.com/OpenRadioss/OpenRadioss/releases/download/latest-20260728/OpenRadioss_linux64.zip \
            -o "$lab_radioss_dir/OpenRadioss_linux64.zip"
          echo "598ed7b2905a7bacc8d1781470c250ac79d7558c39ba962768edf3644644fe33  $lab_radioss_dir/OpenRadioss_linux64.zip" | sha256sum --check --strict
          unzip -q "$lab_radioss_dir/OpenRadioss_linux64.zip" -d "$lab_radioss_dir"
          chmod +x "$lab_radioss_dir"/OpenRadioss/exec/*
          echo "CAELAB_OPENRADIOSS_ROOT=$lab_radioss_dir/OpenRadioss" >> "$GITHUB_ENV"
      - name: Verify flight prerequisites and preserve full-history wall rejection
        run: |
          python -m scripts.verify_openradioss --store artifacts/explicit-lab || test "$?" -eq 2
          python - <<'PY'
          from pathlib import Path
          from caelab import Lab
          from caelab.storage import load_json
          root = Path('artifacts/explicit-lab')
          report = load_json(root / 'acceptance.json')
          assert report['freefall_sensitivity'] == report['invalid_input_admission'] == 'PASS'
          assert report['decision'] == 'NOT_RELEASED'
          assert report['status'] in {'PASS', 'PARTIAL'}
          lab = Lab(root)
          for identifier in report['experiments']:
              result = lab.inspect_experiment(identifier)
              assert result['decision'] == 'NOT_RELEASED'
              if identifier.startswith('E-freefall'):
                  assert result['status'] == 'COMPLETED_REVIEW_REQUIRED'
              if identifier.startswith('E-ground-stop'):
                  assert result['solver_status'] == 'COMPLETED'
                  assert result['status'] in {'COMPLETED_REVIEW_REQUIRED', 'REJECTED'}
          if report['status'] == 'PARTIAL':
              assert report['ideal_ground_stop'] == 'REJECTED'
              assert any(lab.inspect_experiment(identifier)['status'] == 'REJECTED'
                         for identifier in ('E-ground-stop', 'E-ground-stop-finer'))
          PY
      - name: Verify actual finite-force compliant-stop histories, energy and rebound
        run: python -m scripts.verify_compliant_drop --store artifacts/compliant-drop-lab
      - name: Preserve native flight, contact failures and all common evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: explicit-cae-lab-${{ github.sha }}
          path: |
            artifacts/explicit-lab/
            artifacts/compliant-drop-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  doe:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install structural solver for sampled CAD children
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh calculix-ccx
          gmsh -version
          ccx -v || true
      - name: Run seeded DOE through CAD gates and structural child runs
        run: python -m scripts.verify_doe --store artifacts/doe-lab
      - name: Preserve campaign plans, journals, CAD and solver evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doe-cae-lab-${{ github.sha }}
          path: artifacts/doe-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
