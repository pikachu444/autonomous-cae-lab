name: CAE Lab verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-mcp.txt
            plugins/fixture_design/upstream/requirements.txt
            plugins/fixture_design/upstream/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/verify_mcp.py

  native:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned FreeCAD command wrapper
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage \
            --output /tmp/fixture-freecad.AppImage
          echo 'f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434  /tmp/fixture-freecad.AppImage' | sha256sum --check
          chmod +x /tmp/fixture-freecad.AppImage plugins/fixture_design/upstream/scripts/freecad_appimage.sh
          echo "FREECAD_APPIMAGE=/tmp/fixture-freecad.AppImage" >> "$GITHUB_ENV"
          echo "FREECAD_CMD=$PWD/plugins/fixture_design/upstream/scripts/freecad_appimage.sh" >> "$GITHUB_ENV"
      - name: Core to native Part and Sketcher acceptance
        run: python -m scripts.verify_native --store artifacts/native-lab
      - name: Preserve CAD revisions and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-cae-lab-${{ github.sha }}
          path: artifacts/native-lab/
          if-no-files-found: warn
          retention-days: 30

  structural:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            plugins/fixture_design/upstream/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned distribution solver packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh calculix-ccx
          gmsh -version
          ccx -v || true
      - name: Analyze the registered CAD experiment's exact STEP
        run: python -m scripts.verify_analysis --store artifacts/linear-lab
      - name: Preserve mesh, deck, raw fields and digital thread
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structural-cae-lab-${{ github.sha }}
          path: artifacts/linear-lab/
          if-no-files-found: warn
          retention-days: 30
