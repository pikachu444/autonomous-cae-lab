name: Product regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Run product regression, selected pytest tests or one product CI job
        type: choice
        options: [full, selected, job]
        default: full
      job_selection:
        description: 'Job mode: run one existing CI job with its original runtime and checks'
        type: choice
        options: [core, research-driver-source]
        default: core
      test_selection:
        description: 'Selected mode: space-separated tests/file.py or tests/file.py::node (quote names containing spaces; use /)'
        type: string
        default: ''
      test_platform:
        description: Platform for selected tests (native solver runtimes are not installed)
        type: choice
        options: [linux, windows, both]
        default: linux

permissions:
  contents: read

concurrency:
  group: caelab-product-${{ github.ref }}${{ (inputs.mode == 'selected' || inputs.mode == 'job') && format('-{0}-{1}', inputs.mode, github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  invalid-selection:
    name: Product invalid selection
    if: ${{ github.event_name == 'workflow_dispatch' && (!contains(fromJSON('["full","selected","job"]'), inputs.mode) || (inputs.mode == 'job' && !contains(fromJSON('["core","research-driver-source"]'), inputs.job_selection))) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unsupported manual mode or job
        shell: python
        run: raise SystemExit('Choose a supported workflow mode and job_selection.')

  selected-tests:
    name: Product selected pytest (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'selected' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.test_platform == 'both' && '["ubuntu-24.04","windows-2025"]' || inputs.test_platform == 'windows' && '["windows-2025"]' || '["ubuntu-24.04"]') }}
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      CAELAB_FREECAD_REFERENCE_FEM: ${{ github.workspace }}/reference_FreeCAD_1.1.4/src/Mod/Fem
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate existing test file and node selections
        id: selection
        env:
          TEST_SELECTION: ${{ inputs.test_selection }}
          TEST_PLATFORM: ${{ inputs.test_platform }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path, PureWindowsPath
          import shlex

          if os.environ['TEST_PLATFORM'] not in {'linux', 'windows', 'both'}:
              raise SystemExit('Select linux, windows or both.')
          try:
              targets = shlex.split(os.environ['TEST_SELECTION'])
          except ValueError as exc:
              raise SystemExit(f'Invalid quoted test selection: {exc}') from exc
          if not targets:
              raise SystemExit('Selected mode requires at least one existing tests/*.py file or node.')
          root = Path.cwd().resolve()
          tests_root = (root / 'tests').resolve()
          for target in targets:
              file_name = target.partition('::')[0]
              path = Path(file_name)
              if (target.startswith('-') or path.is_absolute()
                      or PureWindowsPath(file_name).is_absolute()
                      or not path.parts or path.parts[0] != 'tests'
                      or '..' in path.parts or path.suffix != '.py'):
                  raise SystemExit(f'Only repository-relative tests/*.py files or nodes are allowed: {target!r}')
              try:
                  resolved = (root / path).resolve(strict=True)
              except (OSError, ValueError) as exc:
                  raise SystemExit(f'Test file does not exist: {file_name!r}') from exc
              if (not resolved.is_relative_to(root) or not resolved.is_relative_to(tests_root)
                      or not resolved.is_file()):
                  raise SystemExit(f'Test file must remain inside tests/: {file_name!r}')
          print('Selected platform:', os.environ['TEST_PLATFORM'])
          print('Selected existing tests:', json.dumps(targets, ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('targets=' + json.dumps(targets) + '\n')
      - name: Install pinned official FreeCAD FEM reference source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FreeCAD/FreeCAD
          ref: 4fd3bf320d9566a27e60069fc8387448aaa3a094 # 1.1.4
          path: reference_FreeCAD_1.1.4
          sparse-checkout: src/Mod/Fem
          persist-credentials: false
      - name: Install Linux Qt shared-library runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0t64 libx11-6 fonts-noto-cjk
      - name: Install existing project test and research UI dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[numerical,material,assist,sensitivity,mcp,research-ui,dev]"
      - name: Run selected tests and collect every failure
        env:
          VALIDATED_TARGETS: ${{ steps.selection.outputs.targets }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          Path('artifacts').mkdir(exist_ok=True)
          targets = json.loads(os.environ['VALIDATED_TARGETS'])
          raise SystemExit(subprocess.call([
              sys.executable, '-m', 'pytest', '-v', '--durations=20', '--maxfail=0',
              '--continue-on-collection-errors',
              '-o', 'faulthandler_timeout=120',
              '-o', 'junit_suite_name=selected-tests-' + os.environ['RUNNER_OS'],
              '--junitxml=artifacts/selected-tests.xml', *targets,
          ]))
      - name: Preserve selected test failures and skips
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-selected-tests-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/selected-tests.xml
          if-no-files-found: warn
          retention-days: 30

  research-driver-source:
    name: Product research workflow (Windows)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'research-driver-source') }}
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: setup_python
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[numerical,material,mcp,assist,sensitivity,research-ui,dev]"
        id: python_deps
      - name: Require the installed research and Qt dependencies
        id: research_runtime
        run: python -c "import felupe, scipy, matplotlib; from PySide6 import QtCore, QtGui, QtTest, QtWidgets"
      - name: Exercise current shared calculation, access and cancellation contracts
        if: ${{ !cancelled() && steps.research_runtime.outcome == 'success' }}
        run: python -m pytest tests/test_workbench_evaluation.py tests/test_workbench_jobs.py tests/test_workbench_numerical.py tests/test_workbench_assist.py tests/test_workbench_recovery.py tests/test_workbench_review_regressions.py tests/test_workbench_table_preview.py tests/test_selection_research_flow.py -q --junitxml=artifacts/workbench-tests.xml
      - name: Exercise native models and retained discussion-plan workflows
        if: ${{ !cancelled() && steps.research_runtime.outcome == 'success' }}
        run: >-
          python -m pytest -q
          tests/test_native_calculix.py
          tests/test_pre_frozen_analysis.py
          tests/test_frozen_fem.py
          tests/test_mesh_binding_geometry.py
          tests/test_pre_mesh_binding.py
          tests/test_pre_fem_edit.py
          tests/test_pre_project_bundle.py
          tests/test_native_project_actions.py
          tests/test_native_simulation_open.py
          tests/test_native_simulation_ui.py
          tests/test_native_event_transport.py
          tests/test_native_import_http.py::test_transport_guards_and_json_path_injection
          tests/test_job_monitor.py
          tests/test_research_runner_ui.py
          tests/test_discussion_documents.py
          tests/test_discussion_plan_integration.py
          tests/test_research_request_plan_ui.py
          tests/test_numerical_workflows_ui.py::test_saved_prediction_to_explicit_actual_confirmation_and_paired_read
          tests/test_research_expert_ui.py
          tests/test_expert_onboarding_ui.py
          tests/test_expert_connection_ui.py
          tests/test_expert_sources.py
          tests/test_expert_sources_ui.py
          tests/test_assist_readiness.py
          tests/test_research_team_followup.py
          tests/test_research_team_results.py
          tests/test_data_research_handoffs.py
          tests/test_desktop_cross_host.py
          tests/test_native_tool_discovery.py
          tests/test_dynamic_results.py
          tests/test_dynamic_r2_integrity.py
          tests/experiment_expert/test_expert_journal.py
          --junitxml=artifacts/research-workflow-tests.xml
      - name: Annotate workbench failures
        if: failure()
        shell: pwsh
        run: |
          foreach ($reportPath in @('artifacts/workbench-tests.xml', 'artifacts/research-workflow-tests.xml')) {
            if (-not (Test-Path $reportPath)) { continue }
            [xml]$report = Get-Content $reportPath -Raw -Encoding UTF8
            foreach ($failure in $report.SelectNodes('//testcase/failure | //testcase/error')) {
              $title = $failure.ParentNode.GetAttribute('name')
              $detail = $failure.InnerText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=${title}::${detail}"
            }
          }
      - name: Check editable workbench forms
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node --test tests/test_workbench_ui.js
      - name: Bootstrap private Windows Python and verify a real HTTP calculation
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: powershell
        run: .\scripts\verify-windows-install.ps1 -RuntimeRoot "$env:RUNNER_TEMP\cae-windows-runtime" -Port 18779

  core:
    name: Product core (${{ matrix.shard }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || (inputs.mode == 'job' && inputs.job_selection == 'core') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      CAELAB_FREECAD_REFERENCE_FEM: ${{ github.workspace }}/reference_FreeCAD_1.1.4/src/Mod/Fem
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          submodules: true
      - name: Install pinned official FreeCAD FEM reference source
        id: freecad_reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FreeCAD/FreeCAD
          ref: 4fd3bf320d9566a27e60069fc8387448aaa3a094 # 1.1.4
          path: reference_FreeCAD_1.1.4
          sparse-checkout: src/Mod/Fem
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        id: setup_python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-mcp.txt
            plugins/fixture_design/upstream/requirements.txt
            plugins/fixture_design/upstream/requirements-dev.txt
      - name: Install Linux Qt shared-library runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_python.outcome == 'success' }}
        id: qt_runtime
        run: |
          # PySide6 bundles Qt, but its Gui/Widgets/offscreen ELF dependencies
          # still need Ubuntu runtime libraries (not the Qt SDK or XCB dev stack).
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0t64 libx11-6 fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_python.outcome == 'success' }}
        id: dev_deps
      - run: python -m pip install -e ".[numerical,material,assist,sensitivity,mcp,research-ui,dev]"
        if: ${{ !cancelled() && steps.dev_deps.outcome == 'success' }}
        id: python_deps
      - name: Preflight Qt imports and an offscreen QApplication
        if: ${{ !cancelled() && steps.python_deps.outcome == 'success' && steps.qt_runtime.outcome == 'success' }}
        id: qt_preflight
        run: |
          timeout 30s python - <<'PY'
          import PySide6
          from PySide6 import QtCore, QtGui, QtTest, QtWidgets

          app = QtWidgets.QApplication([])
          assert app.platformName() == "offscreen", app.platformName()
          widget = QtWidgets.QLabel("CAE Lab Qt runtime preflight")
          widget.resize(320, 80)
          widget.show()
          app.processEvents()
          assert QtGui.QFontDatabase.families(), "No usable system fonts"
          assert not widget.grab().isNull(), "Offscreen widget rendering failed"
          QtCore.QTimer.singleShot(0, app.quit)
          assert app.exec() == 0
          widget.close()
          print(f"PySide6 {PySide6.__version__}; Qt {QtCore.qVersion()}; "
                f"platform={app.platformName()}; offscreen widget/event loop OK")
          PY
      - name: Run each test file on one core shard
        if: ${{ !cancelled() && steps.qt_preflight.outcome == 'success' && steps.freecad_reference.outcome == 'success' }}
        env:
          TEST_SHARD: ${{ matrix.shard }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          files = sorted({path.as_posix() for pattern in ('test_*.py', '*_test.py')
                          for path in Path('tests').rglob(pattern) if path.is_file()})
          shard = int(os.environ['TEST_SHARD'])
          selected = files[shard::4]
          if not selected:
              raise SystemExit('Core shard has no test files; refusing an unfiltered run.')
          print(f'Core shard {shard + 1}/4: {len(selected)} test files', flush=True)
          raise SystemExit(subprocess.call([
              sys.executable, '-m', 'pytest', '-v', '--durations=20',
              '--maxfail=0', '--continue-on-collection-errors',
              '-o', 'faulthandler_timeout=120',
              '--junitxml=artifacts/core-tests.xml', *selected,
          ]))
      - name: Preserve core test failures and skips
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-core-tests-${{ github.sha }}-${{ matrix.shard }}
          path: artifacts/core-tests.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Check forms, imported meshes and retained PDE/contact fields
        if: ${{ matrix.shard == 0 && !cancelled() && steps.checkout.outcome == 'success' }}
        run: node --test tests/test_experiment_draft.js tests/test_fixture_controls.js tests/test_fixture_field_controls.js tests/test_native_structural_field.js tests/test_fixture_field_viewer.js tests/test_cad_controls.js tests/test_native_upload_controls.js tests/test_analysis_conditions_controls.js tests/test_analysis_conditions_ui.js tests/test_campaign_controls.js tests/test_condition_campaign_workflow.js tests/test_comparison_research.js tests/test_fixture_optimization_handoff.js tests/test_imported_mesh_controls.js tests/test_pde_field_inspector.js tests/test_contact_field_inspector.js tests/test_result_presentation.js tests/test_result_workflow.js tests/test_research_handoff.js tests/test_research_answer.js
      - run: python scripts/verify_mcp.py
        if: ${{ matrix.shard == 0 && !cancelled() && steps.python_deps.outcome == 'success' }}
      - name: Check current workbench UI
        if: ${{ matrix.shard == 0 && !cancelled() && steps.checkout.outcome == 'success' }}
        run: node --test tests/test_workbench_ui.js
      - name: Check generic Git identity reader
        if: ${{ matrix.shard == 0 && !cancelled() && steps.checkout.outcome == 'success' }}
        run: node --test openscience/tests/native_git_state.test.mjs
      - name: Connect the local HTTP research, CAD gates and verified evidence exports
        if: ${{ matrix.shard == 0 && !cancelled() && steps.python_deps.outcome == 'success' }}
        run: python -m scripts.verify_lab_ui --store artifacts/http-core-lab --skip-pde
      - name: Preserve common HTTP acceptance and portable evidence
        if: ${{ always() && matrix.shard == 0 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-http-core-cae-lab-${{ github.sha }}
          path: artifacts/http-core-lab/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
