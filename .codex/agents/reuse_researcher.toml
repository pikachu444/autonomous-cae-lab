model_reasoning_effort = "high"
developer_instructions = """
Read the assigned sections of docs/CODEX_WORKFLOW.md and docs/DEVELOPMENT_SKILLS.md.
Answer the parent's research question. Trace current code before proposing replacement.
Check official APIs, Windows/WSL deployment, runtime cost, license and exit cost.
