#:schema https://developers.openai.com/codex/config-schema.json
# Development-only, project-scoped defaults. Read docs/CODEX_WORKFLOW.md.
# Active only in a trusted project and a compatible client/account.
# No authentication, permissions, global settings, or product runtime changes.
# Latest user assignment: Sol/xhigh leads detailed planning; Astra/xhigh reviews.
# This project default does not prove the current application's active model.
# Speed is intentionally not overridden; Standard is recommended.
model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

[mcp_servers.moai]
command = "C:/Users/pikac/AppData/Local/Programs/moai/moai.exe"
args = ["mcp-server"]
# Planning records only. Pro/Astra collaboration uses the user's assigned routes.
enabled_tools = ["spec_audit", "spec_drift", "spec_progress", "todo_list"]
env_vars = ["MOAI_HOME", "MOAI_KANBAN_ID", "MOAI_SESSION_PID", "MOAI_KANBAN_BACKEND", "MOAI_FACTORY_WORKER", "MOAI_FACTORY_WORKERS", "CLAUDE_PROJECT_DIR", "CLAUDE_CODE_SESSION_ID"]
default_tools_approval_mode = "writes"

[tui]
status_line = ["model-with-reasoning", "codex-version", "context-remaining", "five-hour-limit", "weekly-limit", "current-dir", "git-branch", "branch-changes", "pull-request-number", "run-state", "task-progress", "approval-mode", "fast-mode", "thread-title"]
