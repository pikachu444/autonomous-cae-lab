workflow:
  execution_mode: manual
  auto_clear:
    enabled: false
    after_plan: false
    after_run: false
  project:
    continuation: none
  worktree:
    auto_create: false
    auto_merge: false
    auto_cleanup: false
  autonomy:
    mode: manual
# No automatic provider/model/merge transition. Codex uses MoAI as a tool and
# dispatches authorized implementation after the user's work-progress direction.
